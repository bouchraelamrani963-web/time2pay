# Disposable local database; never mount/import existing data or expose remotely.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: qa_runner
      POSTGRES_PASSWORD: ${TIME2PAY_QA_DATABASE_PASSWORD:?Set a disposable local-only password}
      POSTGRES_DB: time2pay_auth_qa
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_runner -d time2pay_auth_qa"]
      interval: 5s
      timeout: 3s
      retries: 10
